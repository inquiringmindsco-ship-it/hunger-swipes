name: CI
# IMG-DS Phase 1 (2026-10-25): $0-spend quality gate using existing tools only.
# Blocking checks: typecheck, unit suites (fixture-based, no DB/credentials needed), production build.
# Playwright e2e against preview deployments is intentionally NOT automated here yet —
# it requires a Vercel Protection Bypass token (owner-provided); see IMG-DEV.md blockers.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (lint gate — matches local practice)
        run: npx tsc --noEmit
      - name: Unit suites (foundation + launch recovery + protection fixtures)
        run: npm test
      - name: Production build (no real credentials required)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          ADMIN_SECRET: placeholder-admin-secret
        run: npx next build
      - name: Deck availability smoke (fixture-level logic assertions)
        run: node --test --experimental-strip-types tests/discover-recovery.test.ts
